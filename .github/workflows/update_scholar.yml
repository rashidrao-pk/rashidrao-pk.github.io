name: Update Scholar Metrics

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          pip install scholarly

      - name: Update metrics
        run: |
          python scripts/update_scholar.py
        continue-on-error: true  # Don't fail the entire workflow on transient errors

      - name: Commit changes
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add _data/research_metrics.json

          git diff --cached --quiet || (
            git commit -m "Update Google Scholar metrics"
            git push
          )
